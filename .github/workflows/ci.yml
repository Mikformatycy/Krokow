name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @krok/mobile exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm check:generated
      - run: pnpm build:web
      - run: cp .env.example .env
      - run: pnpm db:config
      - run: pnpm db:up
      - run: pnpm db:check
      - run: pnpm test:db
      - if: always()
        run: pnpm db:stop
